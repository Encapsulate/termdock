[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "termdock"
version = "1.0.3"
description = "Persistent, multi-tab SSH workspaces in your browser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Encapsulate"}]
keywords = ["ssh", "terminal", "ttyd", "tmux", "self-hosted"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: System :: Systems Administration",
]
dependencies = ["aiohttp==3.14.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[project.scripts]
termdock = "termdock.app:main"
termdock-launcher = "termdock.launcher:main"
termdock-password = "termdock.auth:password_cli"

[project.urls]
Homepage = "https://github.com/Encapsulate/termdock"
Issues = "https://github.com/Encapsulate/termdock/issues"
Repository = "https://github.com/Encapsulate/termdock"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termdock = ["static/*", "tmux.conf"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
