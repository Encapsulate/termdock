# Retain deep pane history and make the wheel scroll tmux history even when a
# full-screen program inside the pane has enabled mouse reporting.
set-option -g history-limit 100000
set-option -g mouse on
set-option -s set-clipboard on
bind-key -T root WheelUpPane if-shell -F -t = "#{pane_in_mode}" "send-keys -M" "copy-mode -e"
bind-key -T root MouseDown3Pane display-menu -O -t = -T "#[align=centre]Terminal" -x M -y M "Copy Mode" c "copy-mode" "Paste tmux Buffer" p "paste-buffer" "Horizontal Split" h "split-window -h" "Vertical Split" v "split-window -v"
unbind-key -q -T root MouseUp3Pane
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear "termdock-#{session_name}-"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear "termdock-#{session_name}-"
bind-key -T copy-mode MouseDown3Pane display-menu -O -t = -T "#[align=centre]Terminal" -x M -y M "Copy Mode" c "copy-mode" "Paste tmux Buffer" p "paste-buffer" "Horizontal Split" h "split-window -h" "Vertical Split" v "split-window -v"
unbind-key -q -T copy-mode MouseUp3Pane
bind-key -T copy-mode-vi MouseDown3Pane display-menu -O -t = -T "#[align=centre]Terminal" -x M -y M "Copy Mode" c "copy-mode" "Paste tmux Buffer" p "paste-buffer" "Horizontal Split" h "split-window -h" "Vertical Split" v "split-window -v"
unbind-key -q -T copy-mode-vi MouseUp3Pane
